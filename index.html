<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="APEX Motorsport — l'actualité, les championnats, les pilotes et le calendrier du sport automobile mondial.">
<meta name="theme-color" content="#080808">
<title>APEX MOTORSPORT | Racing Beyond Limits</title>

<style>
:root {
  --bg:#080808;
  --panel:#111111;
  --text:#f4f4f4;
  --muted:#a5a5a5;
  --red:#e50919;
  --line:#292929;
  --max:1180px;
}
* {box-sizing:border-box;}
html {scroll-behavior:smooth;}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.55;
}
a {color:inherit;text-decoration:none;}
button,input {font:inherit;}
.container {
  width:min(var(--max),calc(100% - 40px));
  margin:0 auto;
}
.topline {
  height:4px;
  background:linear-gradient(90deg,var(--red) 0 35%,#fff 35% 37%,#171717 37%);
}
header {
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(8,8,8,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.nav-wrap {
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
}
.brand {
  display:flex;
  align-items:center;
  gap:11px;
  min-width:190px;
}
.brand-mark {
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border:2px solid var(--red);
  transform:skew(-9deg);
  font-weight:900;
  font-size:25px;
  color:#fff;
}
.brand-name {
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
  line-height:1;
}
.brand-name span {color:var(--red);}
.brand-sub {
  display:block;
  margin-top:5px;
  font-size:9px;
  letter-spacing:3px;
  color:var(--muted);
}
nav {
  display:flex;
  align-items:center;
  gap:22px;
}
nav a {
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:#d5d5d5;
  transition:color .2s;
}
nav a:hover {color:var(--red);}
.nav-actions {
  display:flex;
  align-items:center;
  gap:10px;
}
.lang-btn,.menu-btn {
  border:1px solid #444;
  color:#fff;
  background:transparent;
  padding:8px 11px;
  cursor:pointer;
  font-weight:700;
}
.menu-btn {display:none;}

.hero {
  min-height:510px;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 78% 48%,rgba(229,9,25,.22),transparent 32%),
    linear-gradient(110deg,#080808 0%,#101010 58%,#1b080a 100%);
  border-bottom:1px solid var(--line);
}
.hero::after {
  content:"APEX";
  position:absolute;
  right:-30px;
  bottom:-90px;
  font-size:clamp(180px,31vw,430px);
  font-weight:900;
  letter-spacing:-20px;
  color:rgba(255,255,255,.035);
  pointer-events:none;
}
.hero-content {
  position:relative;
  z-index:1;
  max-width:720px;
  padding:75px 0;
}
.eyebrow {
  color:var(--red);
  text-transform:uppercase;
  letter-spacing:4px;
  font-size:11px;
  font-weight:800;
}
h1 {
  font-size:clamp(46px,7vw,86px);
  line-height:.98;
  margin:18px 0;
  letter-spacing:-3px;
  text-transform:uppercase;
}
h1 span {color:var(--red);}
.hero p {
  max-width:590px;
  color:#c4c4c4;
  font-size:17px;
}
.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:22px;
  padding:13px 20px;
  background:var(--red);
  color:#fff;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
  font-size:12px;
  border:1px solid var(--red);
  transition:.2s;
}
.btn:hover {background:transparent;color:#fff;}

.section {padding:76px 0;}
.section-head {
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:28px;
}
.section-kicker {
  color:var(--red);
  text-transform:uppercase;
  font-size:10px;
  letter-spacing:3px;
  font-weight:800;
}
h2 {
  margin:7px 0 0;
  font-size:clamp(28px,4vw,42px);
  text-transform:uppercase;
  letter-spacing:-1px;
}
.section-desc {
  color:var(--muted);
  max-width:520px;
  margin:9px 0 0;
}
.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}
.champ-card,.news-card,.driver-card,.event-card {
  background:var(--panel);
  border:1px solid var(--line);
  transition:transform .2s,border-color .2s;
}
.champ-card:hover,.news-card:hover,
.driver-card:hover,.event-card:hover {
  transform:translateY(-4px);
  border-color:#555;
}
.champ-visual {
  height:150px;
  display:flex;
  align-items:end;
  padding:18px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#242424,#090909);
}
.champ-visual::after {
  content:"";
  position:absolute;
  width:170px;
  height:170px;
  right:-35px;
  top:-75px;
  border:22px solid rgba(229,9,25,.6);
  border-radius:50%;
}
.champ-visual strong {
  position:relative;
  z-index:1;
  font-size:28px;
  text-transform:uppercase;
  letter-spacing:1px;
}
.champ-body {padding:18px;}
.champ-body p {
  color:var(--muted);
  font-size:13px;
  margin:6px 0 0;
}
.text-link {
  display:inline-block;
  margin-top:13px;
  color:#fff;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:800;
}
.text-link::after {content:"  →";color:var(--red);}
.toolbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:22px;
}
.search {
  flex:1 1 230px;
  min-width:0;
  background:#111;
  color:#fff;
  border:1px solid #383838;
  padding:12px 14px;
  outline:none;
}
.search:focus {border-color:var(--red);}
.filter-btn {
  padding:10px 13px;
  border:1px solid #383838;
  background:#111;
  color:#ddd;
  cursor:pointer;
  font-size:11px;
  text-transform:uppercase;
  font-weight:800;
}
.filter-btn.active,.filter-btn:hover {
  background:var(--red);
  border-color:var(--red);
  color:#fff;
}
.driver-card {padding:19px;min-height:150px;}
.driver-top {
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:start;
}
.driver-initial {
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  background:#242424;
  border-left:3px solid var(--red);
  font-weight:900;
}
.category {
  color:var(--red);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:2px;
  font-weight:800;
}
.driver-card h3 {margin:13px 0 3px;font-size:19px;}
.driver-card p {margin:0;color:var(--muted);font-size:12px;}
.empty {
  display:none;
  color:var(--muted);
  padding:25px;
  border:1px dashed #444;
  text-align:center;
  grid-column:1/-1;
}
